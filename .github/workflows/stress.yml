name: Server stress test

# Deliberately separate from ci.yml: this runs for minutes under
# sustained concurrent load, not seconds -- not something every push/PR
# should have to wait on. Runs nightly plus on-demand.
on:
  schedule:
    - cron: "17 3 * * *" # nightly, off-the-hour to avoid GitHub's own peak-load minute
  workflow_dispatch:
    inputs:
      duration:
        description: "Seconds each worker hammers the server"
        default: "300"
      concurrency:
        description: "Number of concurrent workers"
        default: "30"

permissions:
  contents: read

jobs:
  stress:
    name: server/stress_test.sh (sustained concurrent load)
    runs-on: ubuntu-latest
    # Must cover the longest documented soak (STRESS_DURATION=1800, see
    # server/stress_test.sh) plus setup overhead -- not just the 300s
    # dispatch default. A hung worker still fails fast instead of sitting
    # on a runner until the 360-minute platform default. The validation
    # step below rejects durations beyond ~3300s; longer runs need a
    # timeout bump alongside (a derived expression was considered, but
    # timeout-minutes must be a positive integer and duration/60 is
    # fractional for non-multiple-of-60 inputs).
    timeout-minutes: 60
    steps:
      - name: Validate duration fits the job timeout
        env:
          STRESS_DURATION: ${{ inputs.duration || '300' }}
        run: |
          if ! [[ "$STRESS_DURATION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::duration must be a positive integer (got '$STRESS_DURATION')" >&2
            exit 1
          fi
          # 60-minute job timeout minus setup/upload overhead.
          if [ "$STRESS_DURATION" -gt 3300 ]; then
            echo "::error::duration $STRESS_DURATION exceeds the 60-minute job timeout budget (max ~3300s) -- bump timeout-minutes alongside" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Run the stress test
        env:
          STRESS_DURATION: ${{ inputs.duration || '300' }}
          STRESS_CONCURRENCY: ${{ inputs.concurrency || '30' }}
        run: ./server/stress_test.sh

      # cancelled(), not just failure(): a timeout-minutes cancellation
      # deserves the same partial artifacts a real failure gets, same
      # reasoning kasan-boot.yml's own upload step already uses.
      - name: Upload server log and per-worker error details on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: stress-test-failure
          path: server/stress-failure-artifacts/
          if-no-files-found: ignore
