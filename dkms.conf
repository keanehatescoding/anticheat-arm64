# DKMS package descriptor for the anticheat kernel module.
#
# Install (from a checkout at /usr/src/anticheat-1.0.0, see scripts/
# dkms-install.sh for the copy step):
#   sudo dkms add    -m anticheat -v 1.0.0
#   sudo dkms build  -m anticheat -v 1.0.0
#   sudo dkms install -m anticheat -v 1.0.0
#
# DKMS reinvokes MAKE[0] automatically on every kernel package upgrade
# (via the /etc/kernel/postinst.d/dkms hook most distros already ship),
# so the module is rebuilt for the new kernel without user action.
#
# Only the kernel module is DKMS's concern; the userspace daemon/CLI is
# built and packaged separately (see Makefile's `daemon` target).

PACKAGE_NAME="anticheat"
PACKAGE_VERSION="1.0.0"

BUILT_MODULE_NAME[0]="anticheat"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/extra"

## Build entry point: scripts/dkms-build.sh (not plain `make -C ... modules`).
## The top-level Makefile auto-detects a clang/LLVM-built target kernel (as on
## Arch/CachyOS) and matches its toolchain, otherwise the module builds but
## fails at insmod with "Invalid module format". A direct Kbuild call here
## would bypass that detection for every DKMS install (see issue #36), so the
## helper ports the same check to this path: it reads the *target* kernel's
## own ${kernel_source_dir}/.config (CONFIG_CC_IS_CLANG, CONFIG_AS_IS_LLVM,
## CONFIG_LD_IS_LLD) and forwards LLVM=1 (full LLVM) or CC=clang (mixed
## clang/GNU) to Kbuild. To force a toolchain by hand (e.g. stripped headers
## with no readable .config), export LLVM=1 or CC=<compiler> in the build
## environment -- explicit values always win over autodetection.
MAKE[0]="${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/scripts/dkms-build.sh ${kernel_source_dir} ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

## Module tunables for DKMS/packaged installs (see issue #47).
## ac_scan_window (src/anticheat_module.c): forward+backward scan window in
## bytes the boot-time syscall-table search covers from _etext / the read
## handler. Default 32 MB (0x2000000), clamped to [1 MB, 256 MB] -- an
## out-of-range value warns and falls back to the default rather than
## hanging the scan. Only raise it if dmesg says the table was not found
## and suggests trying a larger window (unusual layouts: large debug/KASAN
## images can push the table further out than the default covers).
## DKMS rebuilds don't need this -- set it persistently via modprobe.d:
##   echo "options anticheat ac_scan_window=67108864" | sudo tee /etc/modprobe.d/anticheat.conf
## then `sudo rmmod anticheat && sudo modprobe anticheat` (or reboot).
## Runtime, no reload: echo <bytes> | sudo tee /sys/module/anticheat/parameters/ac_scan_window.
## Hand-built module: sudo insmod ./anticheat.ko ac_scan_window=<bytes>.

AUTOINSTALL="yes"

# Minimum supported kernel: 6.12+ (uses sized_strscpy, the _noprof
# allocators, for_class_mod_mem_type, and maple-tree VMA iteration -- see
# README/CONTRIBUTING). Without this guard DKMS attempts a build on any
# older kernel still installed (e.g. during a staggered upgrade) and fails
# with a raw compiler error about a missing/renamed API instead of a clear
# "unsupported kernel" skip. The second alternative future-proofs the
# constraint past a hypothetical 7.x/10.x major bump.
BUILD_EXCLUSIVE_KERNEL="^6\.(1[2-9]|[2-9][0-9]|[1-9][0-9]{2,})|^([7-9]|[1-9][0-9]+)\."

# DKMS has built-in Secure Boot signing; nothing to configure here for it.
# (An earlier version of this file tried to set MOK_SIGNING_KEY/MOK_CERTIFICATE
# right here in the package's dkms.conf, and before that a custom
# `sign_tool=` hook calling a hand-rolled script. Both were wrong -- verified
# against a real DKMS build. `sign_tool` isn't a real directive in this DKMS;
# it's silently never invoked. MOK_SIGNING_KEY/MOK_CERTIFICATE ARE in dkms's
# whitelist of recognized package-conf variables (so nothing complains about
# them), but this version's signing code never reads them into the
# mok_signing_key/mok_certificate it actually uses. The real hook is
# $mok_signing_key/$mok_certificate loaded from the *system-wide*
# /etc/dkms/framework.conf(.d/*), which applies to every DKMS package on the
# machine, not just this one. scripts/dkms-install.sh installs a
# framework.conf.d fragment pointing those at /var/lib/anticheat/mok/ and
# pre-creates that directory (DKMS's own openssl call won't create missing
# parent directories) before the first build. Without that fragment, DKMS
# still signs modules by default using its own shared key at
# /var/lib/dkms/mok.{key,pub} -- except on Ubuntu, where an unset key first
# tries the Ubuntu-only `update-secureboot-policy` helper and silently skips
# signing if that binary isn't installed. The fragment sidesteps that.
